services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eds}
      POSTGRES_DB: ${POSTGRES_DB:-eds}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
  neo4j:
    image: neo4j:5.22
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4jpassword}
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4jdata:/data
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports: ["8000:8000"]
    depends_on: [postgres, neo4j]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata: {}
  neo4jdata: {}

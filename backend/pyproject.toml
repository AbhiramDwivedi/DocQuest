[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docquest-backend"
version = "0.1.0"
description = "DocQuest backend (FastAPI + MCP)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.1.18",
  "pgvector>=0.2.5",
  "neo4j>=5.20.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pymupdf>=1.24.5",
  "pdfminer.six>=20231228",
  "python-docx>=1.1.0",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1.2",
  "mailparser>=3.15.0",
  "extract-msg>=0.52.6",
  "Pillow>=10.3.0",
  "pytesseract>=0.3.10",
  "spacy>=3.7.4",
  "networkx>=3.2.1",
  "litellm>=1.43.5",
  "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4.7", "mypy>=1.10.0", "pytest>=8.2.0", "pytest-asyncio>=0.23.7", "requests>=2.32.0"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B"]

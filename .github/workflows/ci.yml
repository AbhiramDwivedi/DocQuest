name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/[dev]
      - name: Lint & Typecheck
        run: |
          ruff backend
          mypy --install-types --non-interactive backend || true
      - name: Tests
        run: pytest -q backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          cd frontend
          npm ci || npm i
      - name: Build
        run: |
          cd frontend
          npm run build
